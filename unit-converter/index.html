<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Unit Converter</title>
    <link
      rel="stylesheet"
      href="styles.css"
    />
  </head>
  <body>
    <main class="mainContainer">
      <section class="displayContainer">
        <h1>Metric/Imperial Unit Conversion</h1>
        <input
          type="text"
          placeholder="50"
        />
        <button
          class="convertButton"
          id="convertButton"
        >
          Convert
        </button>
      </section>
      <section class="convertContainer">
        <article class="lengthContainer">
          <h2>Length(Meter/Feet)</h2>
          <p>20 meters = 65.616 feet | 20 feet = 6.096 meters</p>
        </article>
        <article class="volumeContainer">
          <h2>Volume(Liters/Gallons)</h2>
          <p>20 liters = 5.284 gallons | 20 gallons = 75.708 liters</p>
        </article>
        <article class="massContainer">
          <h2>Mass(Kilograms/Pounds)</h2>
          <p>20 kilos = 44.092 pounds | 20 pounds = 9.072 kilos</p>
        </article>
      </section>
    </main>
    <script src="index.js"></script>
  </body>
</html>
