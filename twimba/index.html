<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles.css"
    />
    <title>Twimba</title>
  </head>
  <body>
    <header>
      <h1>Twimba</h1>
    </header>
    <main>
      <div class="tweet-input-area">
        <img
          src="images/scrimbalogo.png"
          class="profile-pic"
        />
        <textarea
          placeholder="Whats Happening?"
          id="tweet-input"
        ></textarea>
      </div>
      <button id="tweet-btn">Tweet</button>
      <div
        class="feed"
        id="feed"
      ></div>
    </main>
    <script
      type="module"
      src="script.js"
    ></script>
  </body>
</html>
